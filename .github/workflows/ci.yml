name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL for the tests, same major version as docker-compose.yml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ralliyy
          POSTGRES_PASSWORD: ralliyy
          POSTGRES_DB: ralliyy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ralliyy"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://ralliyy:ralliyy@localhost:5432/ralliyy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t ralliyy .
